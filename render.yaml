services:
  - type: web
    name: permanent-barcode-video
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /video

    envVars:
      - key: APP_SECRET
        sync: false

      - key: ADMIN_PASSWORD
        sync: false

      - key: PUBLIC_URL
        sync: false

      - key: SUPABASE_URL
        sync: false

      - key: SUPABASE_SECRET_KEY
        sync: false

      - key: SUPABASE_STORAGE_BUCKET
        value: videos
