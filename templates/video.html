```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>A Birthday Moment ❤️</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: "DM Sans", sans-serif;

            background:
                radial-gradient(
                    circle at 15% 15%,
                    rgba(255, 120, 170, 0.22),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 85% 85%,
                    rgba(255, 180, 100, 0.16),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 50% 50%,
                    rgba(180, 100, 255, 0.08),
                    transparent 45%
                ),
                #09090d;

            color: #ffffff;
        }

        /* =========================
           MAIN PAGE
           ========================= */

        .page {
            min-height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 32px 16px;
        }

        /* =========================
           HEADER
           ========================= */

        .header {
            width: 100%;
            max-width: 1000px;

            text-align: center;

            margin-bottom: 24px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            padding: 8px 15px;

            border-radius: 999px;

            background: rgba(255, 255, 255, 0.07);

            border: 1px solid rgba(255, 255, 255, 0.12);

            color: #f4d4df;

            font-size: 11px;
            font-weight: 600;

            letter-spacing: 1.5px;

            text-transform: uppercase;

            backdrop-filter: blur(10px);
        }

        .badge-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #fb7185;

            box-shadow:
                0 0 10px rgba(251, 113, 133, 0.9),
                0 0 20px rgba(251, 113, 133, 0.35);
        }

        .title {
            margin: 17px 0 0;

            font-family: "Playfair Display", serif;

            font-size: clamp(32px, 6vw, 55px);

            line-height: 1.1;

            font-weight: 700;

            letter-spacing: -0.7px;
        }

        .subtitle {
            margin: 11px auto 0;

            max-width: 620px;

            color: #b4b4bd;

            font-size: 15px;

            line-height: 1.6;
        }

        /* =========================
           VIDEO
           ========================= */

        .video-wrapper {
            width: 100%;
            max-width: 1000px;

            padding: 8px;

            border-radius: 24px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255, 255, 255, 0.09),
                    rgba(255, 255, 255, 0.035)
                );

            border: 1px solid rgba(255, 255, 255, 0.11);

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.60),
                0 0 80px rgba(255, 100, 160, 0.06);

            backdrop-filter: blur(18px);
        }

        .video-container {
            position: relative;

            width: 100%;

            overflow: hidden;

            border-radius: 18px;

            background: #000;

            aspect-ratio: 16 / 9;
        }

        .video {
            display: block;

            width: 100%;
            height: 100%;

            object-fit: contain;

            background: #000;
        }

        /* =========================
           FOOTER
           ========================= */

        .footer {
            width: 100%;
            max-width: 1000px;

            margin-top: 18px;

            display: flex;

            justify-content: space-between;
            align-items: center;

            color: #71717a;

            font-size: 12px;
        }

        .footer-left {
            display: flex;
            align-items: center;

            gap: 7px;
        }

        .lock {
            font-size: 13px;
        }

        .footer-right {
            opacity: 0.7;
        }

        /* =========================
           EMPTY STATE
           ========================= */

        .empty-page {
            min-height: 100vh;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 25px;
        }

        .empty-card {
            width: 100%;
            max-width: 480px;

            text-align: center;

            padding: 50px 30px;

            border-radius: 28px;

            background: rgba(255, 255, 255, 0.06);

            border: 1px solid rgba(255, 255, 255, 0.10);

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.45);

            backdrop-filter: blur(18px);
        }

        .empty-icon {
            width: 70px;
            height: 70px;

            margin: 0 auto 22px;

            display: grid;
            place-items: center;

            border-radius: 50%;

            background: rgba(255, 255, 255, 0.08);

            font-size: 28px;
        }

        .empty-card h1 {
            margin: 0;

            font-family: "Playfair Display", serif;

            font-size: 30px;
        }

        .empty-card p {
            margin: 12px 0 0;

            color: #a1a1aa;

            line-height: 1.6;

            font-size: 14px;
        }

        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 600px) {

            .page {
                padding: 24px 10px;
            }

            .header {
                margin-bottom: 17px;
            }

            .badge {
                font-size: 10px;
                padding: 7px 12px;
            }

            .title {
                font-size: 32px;
            }

            .subtitle {
                font-size: 13px;
            }

            .video-wrapper {
                padding: 5px;

                border-radius: 17px;
            }

            .video-container {
                border-radius: 13px;
            }

            .footer {
                padding: 0 4px;

                font-size: 10px;
            }
        }
    </style>
</head>

<body>

{% if video_url %}

    <main class="page">

        <header class="header">

            <div class="badge">
                <span class="badge-dot"></span>
                Birthday Special
            </div>

            <h1 class="title">
                A Little Birthday Memory ❤️
            </h1>

            <p class="subtitle">
                A special moment, made just for you.
            </p>

        </header>


        <section class="video-wrapper">

            <div class="video-container">

                <video
                    id="birthdayVideo"
                    class="video"
                    controls
                    autoplay
                    muted
                    playsinline
                    preload="auto"
                    controlsList="nodownload noplaybackrate"
                    disablePictureInPicture
                    oncontextmenu="return false;"
                >

                    <source
                        src="{{ video_url }}"
                        type="video/mp4"
                    >

                    Your browser does not support video playback.

                </video>

            </div>

        </section>


        <footer class="footer">

            <div class="footer-left">
                <span class="lock">🔒</span>
                <span>A special memory</span>
            </div>

            <div class="footer-right">
                Made with ❤️
            </div>

        </footer>

    </main>

{% else %}

    <main class="empty-page">

        <section class="empty-card">

            <div class="empty-icon">
                🎂
            </div>

            <h1>
                Your Birthday Surprise
            </h1>

            <p>
                This special birthday memory isn't ready yet.
                Please check again later. ❤️
            </p>

        </section>

    </main>

{% endif %}


<script>
    const video = document.getElementById("birthdayVideo");

    if (video) {

        /*
         * Try to start the video automatically.
         *
         * Browsers generally block autoplay with sound.
         * Therefore we first autoplay muted.
         */

        video.muted = true;

        const startVideo = async () => {

            try {
                await video.play();

                /*
                 * Once playback has started, attempt
                 * to enable sound.
                 *
                 * Some browsers will allow this,
                 * others will keep it muted.
                 */

                video.muted = false;

                try {
                    await video.play();
                } catch (error) {
                    /*
                     * Browser blocked autoplay with sound.
                     * Video will continue playing muted.
                     */
                    video.muted = true;
                }

            } catch (error) {
                console.log("Autoplay was blocked by the browser.");
            }
        };


        /*
         * Start automatically when the page loads.
         */
        window.addEventListener("load", startVideo);


        /*
         * If the browser blocked sound autoplay,
         * enable sound after the visitor's first interaction.
         */

        const enableSound = () => {

            video.muted = false;

            video.play().catch(() => {});

            document.removeEventListener("click", enableSound);
            document.removeEventListener("touchstart", enableSound);
            document.removeEventListener("keydown", enableSound);
        };

        document.addEventListener("click", enableSound, {
            once: true
        });

        document.addEventListener("touchstart", enableSound, {
            once: true
        });

        document.addEventListener("keydown", enableSound, {
            once: true
        });
    }
</script>

</body>
</html>
